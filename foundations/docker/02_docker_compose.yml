# =============================================================================
# Docker Compose — Patterns for Full-Stack Apps
# =============================================================================
# Ref: Resume — multi-service stacks across SecondBrain, PixelPod, Portfolio
#
# Run: docker compose up -d
#      docker compose logs -f api
#      docker compose down -v   # also removes volumes
# =============================================================================


# =============================================================================
# PATTERN 1: FastAPI + PostgreSQL + Redis (SecondBrain / Genius365 stack)
# =============================================================================

version: "3.9"

services:

  # --- API -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner          # for multi-stage builds
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/appdb
      REDIS_URL: redis://cache:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}   # from .env file
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads  # persist uploaded files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- PostgreSQL + pgvector -------------------------------------------------
  db:
    image: pgvector/pgvector:pg16   # includes vector extension for RAG
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql  # run on first start
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis -----------------------------------------------------------------
  cache:
    image: redis:7-alpine
    command: redis-server --appendonly yes  # AOF persistence
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # --- Next.js Frontend (Portfolio style) ------------------------------------
  web:
    build:
      context: ./frontend
      target: runner
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      - api

  # --- Worker (background jobs — transcription pipeline) --------------------
  worker:
    build:
      context: .
    command: python worker.py   # override CMD for worker role
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/appdb
      REDIS_URL: redis://cache:6379/0
    depends_on:
      - db
      - cache
    restart: unless-stopped


# =============================================================================
# PATTERN 2: OVERRIDE FILES (dev vs prod)
# =============================================================================
#
# docker-compose.override.yml (dev) — auto-merged with docker-compose.yml:
#   services:
#     api:
#       volumes:
#         - .:/app              # hot-reload source
#       command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
#
# docker-compose.prod.yml:
#   services:
#     api:
#       image: registry.example.com/myapp:${TAG}
#       restart: always
#
# Run prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up


# =============================================================================
# NETWORKS & VOLUMES
# =============================================================================

volumes:
  pg_data:
  redis_data:

networks:
  default:
    driver: bridge


# =============================================================================
# COMMON COMPOSE COMMANDS CHEATSHEET
# =============================================================================
# docker compose up -d                     # start all services, detached
# docker compose up -d --build api         # rebuild + restart just api
# docker compose logs -f worker            # follow worker logs
# docker compose exec db psql -U postgres  # open psql in running container
# docker compose down                      # stop + remove containers (keep volumes)
# docker compose down -v                   # also remove volumes (destructive!)
# docker compose ps                        # show running containers + health
# docker compose pull                      # pull latest images
