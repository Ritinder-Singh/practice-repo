# ─── KEY CONCEPTS TO UNDERSTAND ──────────────────────────────────────────────
# secrets:         — encrypted, set in repo Settings > Secrets — NEVER hardcode
# GITHUB_TOKEN:    — auto-provided, scoped to the repo, no setup needed
# environment:     — named deploy targets with protection rules (manual approval)
# needs:           — job dependency graph — controls execution order
# if:              — conditional job/step execution
# strategy.matrix: — fan out jobs across combinations (OS, language version, etc.)
# cache:           — speed up pip/npm/maven installs across runs
# artifacts:       — pass files between jobs or download after workflow
