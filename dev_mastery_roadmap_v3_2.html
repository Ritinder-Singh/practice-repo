<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dev Mastery Roadmap v3</title>
<style>
:root{
  --font-mono:'SF Mono','Fira Code','Cascadia Code',monospace;
  --color-text-primary:#1a1a1a;
  --color-text-secondary:#555;
  --color-text-tertiary:#999;
  --color-background-primary:#ffffff;
  --color-background-secondary:#f5f5f4;
  --color-border-primary:#bbb;
  --color-border-secondary:#ddd;
  --color-border-tertiary:#e8e8e8;
  --border-radius-md:8px;
  --border-radius-lg:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-mono);background:#f9f9f8;min-height:100vh;padding:1.5rem}
.rm-wrap{padding:1rem 0}
.rm-title{font-size:22px;font-weight:500;color:var(--color-text-primary);letter-spacing:-0.5px}
.rm-sub{font-size:13px;color:var(--color-text-secondary);margin-top:4px;margin-bottom:1.2rem}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.2rem;align-items:center}
.filter-btn{font-size:11px;padding:4px 10px;border:0.5px solid var(--color-border-secondary);border-radius:20px;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);font-family:var(--font-mono);transition:all 0.15s}
.filter-btn.active{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.phase-block{margin-bottom:2rem}
.phase-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:0.75rem;padding-left:2px;display:flex;align-items:center;gap:8px}
.phase-line{flex:1;height:0.5px;background:var(--color-border-tertiary)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px;cursor:pointer;transition:border-color 0.15s}
.card:hover{border-color:var(--color-border-primary)}
.card.open{border-color:var(--color-border-primary);background:var(--color-background-secondary)}
.card-emoji{font-size:16px;margin-bottom:6px}
.card-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.card-type{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}
.card-days{font-size:10px;color:var(--color-text-secondary);margin-top:4px;padding:2px 6px;background:var(--color-background-secondary);border-radius:4px;display:inline-block}
.card-roles{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.role-tag{font-size:9px;padding:2px 5px;border-radius:3px;font-family:var(--font-mono)}
.tag-be{background:#E6F1FB;color:#0C447C}.tag-fe{background:#E1F5EE;color:#085041}
.tag-fs{background:#FAEEDA;color:#633806}.tag-do{background:#FCEBEB;color:#791F1F}
.tag-ml{background:#EEEDFE;color:#3C3489}.tag-mo{background:#FAECE7;color:#712B13}
.tag-sa{background:#EAF3DE;color:#27500A}.tag-all{background:#F1EFE8;color:#444441}
.detail-panel{margin-top:8px;grid-column:1/-1;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:1.25rem;display:none}
.detail-panel.open{display:block}
.dp-tabs{display:flex;gap:4px;margin-bottom:1rem;flex-wrap:wrap}
.dp-tab{font-size:11px;padding:4px 10px;border:0.5px solid var(--color-border-secondary);border-radius:20px;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);font-family:var(--font-mono);transition:all 0.1s}
.dp-tab.active{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.dp-pane{display:none}.dp-pane.active{display:block}
.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.dp-section{margin-bottom:1rem}.dp-section:last-child{margin-bottom:0}
.dp-h{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;border-bottom:0.5px solid var(--color-border-tertiary);padding-bottom:4px}
.dp-links a{display:block;font-size:12px;color:#185FA5;text-decoration:none;padding:3px 0;line-height:1.5}
.dp-links a:hover{text-decoration:underline}
.dp-links a::before{content:"↗ ";font-size:10px;opacity:0.6}
.concept-list{display:flex;flex-wrap:wrap;gap:4px}
.concept{font-size:11px;padding:3px 7px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:4px;color:var(--color-text-secondary)}
.concept.adv{border-color:#AFA9EC;color:#3C3489}
.project-item{font-size:12px;color:var(--color-text-primary);padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);line-height:1.5}
.project-item:last-child{border-bottom:none}
.proj-label{font-size:10px;font-weight:500;margin-right:5px;padding:1px 5px;border-radius:3px}
.pl-mini{background:#C0DD97;color:#27500A}.pl-major{background:#B5D4F4;color:#0C447C}.pl-excl{background:#F5C4B3;color:#712B13}
.ref-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;margin-bottom:8px}
.ref-card:last-child{margin-bottom:0}
.ref-title{font-size:12px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px}
.ref-title a{color:#185FA5;text-decoration:none}
.ref-title a:hover{text-decoration:underline}
.ref-desc{font-size:11px;color:var(--color-text-secondary);line-height:1.5}
.ref-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.ref-tag{font-size:10px;padding:1px 6px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:3px;color:var(--color-text-tertiary)}
.tag-ct{background:#FDE8F6;color:#7A1260}
.cert-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:3px;margin:2px;font-weight:500}
.cb-free{background:#C0DD97;color:#1E5E00}
.cb-paid{background:#B5D4F4;color:#0C447C}
.cb-top{background:#F5C4B3;color:#712B13}
.cert-item{padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;line-height:1.6}
.cert-item:last-child{border-bottom:none}
.close-btn{float:right;font-size:12px;color:var(--color-text-secondary);cursor:pointer;padding:2px 6px;border:0.5px solid var(--color-border-tertiary);border-radius:4px;background:var(--color-background-secondary)}
.close-btn:hover{color:var(--color-text-primary)}
.dp-fullwidth{grid-column:1/-1}
@media(max-width:500px){.dp-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<button class="filter-btn" data-role="fe">Frontend</button>

<div id="roadmapRoot"></div>

let activeRole="all";
let openCard=null;

function getRoleTags(roles){return roles.map(r=>`<span class="role-tag tag-${r}">${RL[r]||r}</span>`).join('')}
function cardMatchesRole(roles){return activeRole==="all"||roles.includes(activeRole)}

function renderRefs(refs){
  if(!refs||!refs.length) return '<div style="font-size:12px;color:var(--color-text-tertiary)">No sample projects listed yet.</div>';
  return refs.map(r=>`<div class="ref-card">
    <div class="ref-title"><a href="https://github.com/${r.t.includes('github.com')?r.t.replace('https://github.com/',''):r.t}" target="_blank">${r.t}</a></div>
    <div class="ref-desc">${r.d}</div>
    <div class="ref-tags">${(r.tags||[]).map(t=>`<span class="ref-tag">${t}</span>`).join('')}</div>
  </div>`).join('');
}

function renderPanel(item,activeTab){
  const isCert=item.type==='certification';
  const tab=activeTab||(isCert?'certinfo':'resources');
  const proj=item.projects||[];
  const docsHtml=item.docs?item.docs.map(d=>`<a href="${d.u}" target="_blank">${d.l}</a>`).join(''):'';
  const ytHtml=item.youtube?item.youtube.map(d=>`<a href="${d.u}" target="_blank">${d.l}</a>`).join(''):'';
  const pracHtml=item.practice?item.practice.map(d=>`<a href="${d.u}" target="_blank">${d.l}</a>`).join(''):'';
  const projHtml=proj.map(p=>`<div class="project-item"><span class="proj-label pl-${p.t}">${p.t}</span>${p.n}</div>`).join('');
  const basic=item.concepts?.basic||[];
  const adv=item.concepts?.advanced||[];
  const basHtml=basic.map(c=>`<span class="concept">${c}</span>`).join('');
  const advHtml=adv.map(c=>`<span class="concept adv">${c}</span>`).join('');
  const refsHtml=renderRefs(item.refs);
  const legendBadges=`<span style="background:#C0DD97;color:#27500A;padding:1px 4px;border-radius:3px;font-size:10px">mini</span> <span style="background:#B5D4F4;color:#0C447C;padding:1px 4px;border-radius:3px;font-size:10px">major</span> <span style="background:#F5C4B3;color:#712B13;padding:1px 4px;border-radius:3px;font-size:10px">excl</span>`;

  const resourcesPane=`<div class="dp-grid">
    ${docsHtml?`<div class="dp-section"><div class="dp-h">Docs & Official Links</div><div class="dp-links">${docsHtml}</div></div>`:''}
    ${ytHtml?`<div class="dp-section"><div class="dp-h">YouTube</div><div class="dp-links">${ytHtml}</div></div>`:''}
    ${pracHtml?`<div class="dp-section"><div class="dp-h">Practice & Prep</div><div class="dp-links">${pracHtml}</div></div>`:''}
    ${projHtml?`<div class="dp-section"><div class="dp-h">Your Projects — ${legendBadges}</div>${projHtml}</div>`:''}
    ${basHtml&&!isCert?`<div class="dp-section dp-fullwidth"><div class="dp-h">Concepts — <span style="font-size:10px;font-weight:400;color:var(--color-text-secondary)">white = basic &nbsp; <span style="color:#3C3489">purple = advanced</span></span></div><div class="concept-list">${basHtml}${advHtml}</div></div>`:''}
  </div>`;

  const certInfoPane=isCert?`<div class="dp-grid">
    <div class="dp-section dp-fullwidth"><div class="dp-h">🟢 Available Certifications</div>
      ${basic.map(c=>{
        const isFree=c.toLowerCase().includes('free')||c.toLowerCase().includes('auditable')||c.toLowerCase().includes('free exam');
        const isTop=c.toLowerCase().includes('best')||c.toLowerCase().includes('most valued')||c.toLowerCase().includes('top cert')||c.toLowerCase().includes('most hired');
        return `<div class="cert-item">
          ${isTop?`<span class="cert-badge cb-top">⭐ Top Pick</span>`:''}
          ${isFree?`<span class="cert-badge cb-free">Free/Audit</span>`:''} ${c}</div>`;
      }).join('')}
    </div>
    <div class="dp-section dp-fullwidth"><div class="dp-h">🔵 Advanced / Specialty Certifications</div>
      ${adv.map(c=>{
        const isFree=c.toLowerCase().includes('free');
        return `<div class="cert-item">${isFree?`<span class="cert-badge cb-free">Free</span>`:''} ${c}</div>`;
      }).join('')}
    </div>
  </div>`:'';

  const refsPane=`<div>${refsHtml}</div>`;

  const tabs=isCert
    ?`<button class="dp-tab ${tab==='certinfo'?'active':''}" onclick="switchTab('${item.id}','certinfo')">📋 Cert Details</button>
       <button class="dp-tab ${tab==='resources'?'active':''}" onclick="switchTab('${item.id}','resources')">Resources & Projects</button>
       <button class="dp-tab ${tab==='refs'?'active':''}" onclick="switchTab('${item.id}','refs')">Repos to Study</button>`
    :`<button class="dp-tab ${tab==='resources'?'active':''}" onclick="switchTab('${item.id}','resources')">Resources & Projects</button>
      <button class="dp-tab ${tab==='refs'?'active':''}" onclick="switchTab('${item.id}','refs')">Sample Repos to Study</button>`;

  return `<button class="close-btn" onclick="closePanel()">close ✕</button>
<div class="dp-tabs">${tabs}</div>
${isCert?`<div class="dp-pane ${tab==='certinfo'?'active':''}" id="pane-cert-${item.id}">${certInfoPane}</div>`:''}
<div class="dp-pane ${tab==='resources'?'active':''}" id="pane-res-${item.id}">${resourcesPane}</div>
<div class="dp-pane ${tab==='refs'?'active':''}" id="pane-ref-${item.id}">${refsPane}</div>`;
}

function switchTab(id,tab){
  const allItems=DATA.phases.flatMap(p=>p.items);
  const item=allItems.find(i=>i.id===id);
  if(!item) return;
  const panel=document.getElementById('panel-'+id);
  if(panel){panel.innerHTML=renderPanel(item,tab);}
}

function closePanel(){
  if(openCard){
    document.getElementById('panel-'+openCard)?.classList.remove('open');
    document.getElementById('card-'+openCard)?.classList.remove('open');
    openCard=null;
  }
}

function toggleCard(id){
  const allItems=DATA.phases.flatMap(p=>p.items);
  const item=allItems.find(i=>i.id===id);
  if(!item) return;
  if(openCard===id){closePanel();return;}
  closePanel();
  openCard=id;
  document.getElementById('card-'+id)?.classList.add('open');
  const panel=document.getElementById('panel-'+id);
  if(panel){
    panel.innerHTML=renderPanel(item,'resources');
    panel.classList.add('open');
    setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
  }
}

function render(){
  const root=document.getElementById('roadmapRoot');
  root.innerHTML=DATA.phases.map(phase=>{
    const vis=phase.items.filter(i=>cardMatchesRole(i.roles));
    if(!vis.length) return '';
    const cards=vis.map(item=>`
      <div class="card ${openCard===item.id?'open':''}" id="card-${item.id}" onclick="toggleCard('${item.id}')">
        <div class="card-emoji">${item.emoji}</div>
        <div class="card-name">${item.name}</div>
        <div class="card-type">${item.type}</div>
        <div class="card-days">${item.days}</div>
        <div class="card-roles">${getRoleTags(item.roles)}</div>
      </div>
      <div class="detail-panel ${openCard===item.id?'open':''}" id="panel-${item.id}">${openCard===item.id?renderPanel(item,'resources'):''}</div>
    `).join('');
    return `<div class="phase-block">
      <div class="phase-label">${phase.label}<span class="phase-line"></span></div>
      <div class="cards-grid">${cards}</div>
    </div>`;
  }).join('');
}

document.getElementById('roleFilters').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn) return;
  activeRole=btn.dataset.role;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b===btn));
  closePanel();
  render();
});

render();
</script>
