spring.application.name=crud-api

# H2 is an in-memory database that Spring Boot boots automatically — no install needed.
# jdbc:h2:mem:testdb creates a named in-memory DB. Data is lost when the app stops.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: creates tables from your @Entity classes on startup, drops them on shutdown.
# Other options: update (alter existing tables), validate (check schema matches, don't change), none.
spring.jpa.hibernate.ddl-auto=create-drop

# Enables the H2 browser console at http://localhost:8080/h2-console
# Use it to inspect tables and run SQL while the app is running.
spring.h2.console.enabled=true
